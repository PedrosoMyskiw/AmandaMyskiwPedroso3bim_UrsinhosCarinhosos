<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatos de Envio & Medidas - Ursinhos Carinhosos</title>
    <link rel="stylesheet" href="formato.css">
</head>

<body onload="listar()">
    <!-- Cabeçalho Mágico -->
    <header>
        <div class="logo-area">
            <span class="logo-icon">📦</span>
            <h1>Formatos de Envio & Medidas</h1>
        </div>
        <p>Reino do Carinho • Cadastro de Embalagens e Medidas para Presentes</p>
    </header>

    <main class="container-master">
        <div class="conteudo-principal">
            <section class="form-esquerda">
                <h2><span>📏</span> Dados da Medida</h2>
                
                <label for="inputId_formato">Sigla / ID da Unidade (Até 2 letras)</label>
                <div class="linha-id">
                    <input type="text" name="inputId_formato" id="inputId_formato" maxlength="2" placeholder="Ex: UN" style="text-transform: uppercase;">
                    <input type="button" value="Procure 🔍" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir ✨" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar ✏️" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir 🗑️" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome_formato">Nome do Formato / Unidade</label>
                <input type="text" name="inputNome_formato" id="inputNome_formato" placeholder="Ex: Unidade Carinhosa">

                <div id="divAviso">Informe a sigla (ex: UN, CX) e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar 💾" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar ❌" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>
        </div>

        <section class="lista-unidades">
            <h3><span>🎁</span> Formatos de Envio Cadastrados</h3>
            <div id="outputSaida">Carregando...</div>
        </section>
    </main>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 Loja Ursinhos Carinhosos. Entregando abraços bem embalados.</p>
    </footer>

    <script src="./formato.js"></script>
</body>
